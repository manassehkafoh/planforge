# Zero-trust networking: default deny, then explicit allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-all, namespace: app }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: core-api-allow, namespace: app }
spec:
  podSelector: { matchLabels: { app: core-api } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { name: edge } } }]
      ports: [{ port: 8080, protocol: TCP }]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { name: data } } }]
      ports: [{ port: 5432, protocol: TCP }, { port: 6379, protocol: TCP }, { port: 9093, protocol: TCP }]
    - to: [{ namespaceSelector: { matchLabels: { name: kube-system } } }]   # DNS
      ports: [{ port: 53, protocol: UDP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: import-sandbox-no-egress, namespace: sandbox }
spec:
  podSelector: { matchLabels: { app: import-sandbox } }
  policyTypes: [Ingress, Egress]       # no ingress, no egress at all
